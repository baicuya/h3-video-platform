[project]
name = "h3-video-platform-backend"
version = "0.1.0"
description = "Jinxiu internal MiniMax H3 video platform backend"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.11",
  "alembic>=1.14",
  "argon2-cffi>=23.1",
  "asyncpg>=0.30",
  "fastapi>=0.115",
  "pydantic-settings>=2.7",
  "PyJWT>=2.10",
  "python-multipart>=0.0.20",
  "redis>=5.2",
  "sqlalchemy[asyncio]>=2.0.36",
  "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.20",
  "httpx>=0.28",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
